{% extends "base.html" %}
{% block content %}
<h2>{{ t.reset_title }}</h2>
<p class="warning">{{ t.reset_warning }} <a href="/export">{{ t.nav_export }}</a>.</p>

<form action="/reset" method="post" class="card danger-card">
  <label>{{ t.reset_type_label }}
    <input type="text" name="confirm_text" required>
  </label>
  <div class="captcha">
    <span>{{ t.reset_math_label }}: {{ a }} {{ op }} {{ b }} =</span>
    <input type="number" name="math_answer" required>
    <input type="hidden" name="a" value="{{ a }}">
    <input type="hidden" name="b" value="{{ b }}">
    <input type="hidden" name="op" value="{{ op }}">
  </div>
  <br />
  <button type="submit" class="danger">{{ t.reset_button }}</button>
</form>
{% endblock %}
