<!doctype html>
<html lang="en" data-theme="{{ theme|default('dark') }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header class="topbar">
      <div class="container rowflex">
        <h1>{{ app_name }}</h1>

        <!-- Mobile menu button (uses Pictogrammers MDI "menu" icon) -->
        <button class="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
          <svg class="icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
            <path d="M3,6H21V8H3V6M3,12H21V14H3V12M3,18H21V20H3V18Z"></path>
          </svg>
        </button>

        <!-- Desktop nav -->
        <nav class="nav desktop-nav">
          <a href="/">Home</a>
          <a href="/export">Export</a>
          <a href="/settings">Settings</a>
          <a href="/reset" class="danger">Reset</a>
        </nav>
      </div>

      <!-- Mobile dropdown nav -->
      <nav id="mobileMenu" class="mobile-menu" hidden>
        <a href="/">Home</a>
        <a href="/export">Export</a>
        <a href="/settings">Settings</a>
        <a href="/reset" class="danger">Reset</a>
      </nav>
    </header>

    <main class="container">
      {% if error %}
        <div class="alert" role="alert">{{ error }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <div class="container">
        <small>&copy; {{ app_name }} — Simple, local-first money tracker.</small>
      </div>
    </footer>

    <script>
      (function () {
        var btn = document.querySelector('.hamburger');
        var menu = document.getElementById('mobileMenu');

        if (!btn || !menu) return;

        function closeMenu() {
          btn.setAttribute('aria-expanded', 'false');
          btn.setAttribute('aria-label', 'Open menu');
          menu.setAttribute('hidden', '');
          document.body.classList.remove('menu-open');
        }
        function openMenu() {
          btn.setAttribute('aria-expanded', 'true');
          btn.setAttribute('aria-label', 'Close menu');
          menu.removeAttribute('hidden');
          document.body.classList.add('menu-open');
        }

        btn.addEventListener('click', function () {
          var open = btn.getAttribute('aria-expanded') === 'true';
          open ? closeMenu() : openMenu();
        });

        // Close on link click
        menu.addEventListener('click', function (e) {
          if (e.target.tagName === 'A') closeMenu();
        });

        // Close on Esc
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeMenu();
        });

        // Close on outside click
        document.addEventListener('click', function (e) {
          if (menu.hasAttribute('hidden')) return;
          var within = e.target.closest('.mobile-menu, .hamburger');
          if (!within) closeMenu();
        });
      })();
    </script>
  </body>
</html>
