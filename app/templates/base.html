<!doctype html>
<html lang="{{ lang|default('en') }}" data-theme="{{ theme|default('dark') }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Theme variants loaded separately; default remains in style.css for redundancy -->
    <link rel="stylesheet" href="/static/themes.css">
  </head>
  <body>
    <header class="topbar">
      <div class="container rowflex">
        <h1>{{ app_name }}</h1>

        <!-- Mobile menu button (Pictogrammers MDI "menu") -->
        <button class="hamburger" aria-label="{{ t.nav_open_menu }}" aria-expanded="false" aria-controls="mobileMenu">
          <svg class="icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
            <path d="M3,6H21V8H3V6M3,12H21V14H3V12M3,18H21V20H3V18Z"></path>
          </svg>
        </button>

        <!-- Desktop nav -->
        <nav class="nav desktop-nav">
          <a href="/">{{ t.nav_home }}</a>
          <a href="/export">{{ t.nav_export }}</a>
          <a href="/settings">{{ t.nav_settings }}</a>
          <a href="/reset" class="danger">{{ t.nav_reset }}</a>
        </nav>
      </div>

      <!-- Mobile dropdown nav -->
      <nav id="mobileMenu" class="mobile-menu" hidden>
        <a href="/">{{ t.nav_home }}</a>
        <a href="/export">{{ t.nav_export }}</a>
        <a href="/settings">{{ t.nav_settings }}</a>
        <a href="/reset" class="danger">{{ t.nav_reset }}</a>
      </nav>
    </header>

    <main class="container">
      {% if error %}
        <div class="alert" role="alert">{{ error }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <div class="container footer-row">
        <small>&copy; {{ app_name }} — {{ t.footer_tagline }}</small>
        <a class="repo-link" href="https://github.com/rh45-one/Savion" target="_blank" rel="noopener">
          <svg class="icon-20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12,2A10,10 0 0,0 2,12C2,16.42 4.87,20.17 8.84,21.5C9.34,21.58 9.5,21.27 9.5,21V19.39C6.73,19.91 6.14,17.97 6.14,17.97C5.68,16.81 5.03,16.5 5.03,16.5C4.12,15.88 5.1,15.9 5.1,15.9C6.1,15.97 6.63,16.93 6.63,16.93C7.5,18.45 9,18 9.57,17.76C9.66,17.11 9.92,16.67 10.2,16.44C7.95,16.21 5.58,15.31 5.58,11.5C5.58,10.39 5.96,9.5 6.62,8.79C6.52,8.56 6.17,7.5 6.72,6.11C6.72,6.11 7.57,5.86 9.5,7.15C10.29,6.93 11.15,6.82 12,6.82C12.85,6.82 13.71,6.93 14.5,7.15C16.43,5.86 17.28,6.11 17.28,6.11C17.83,7.5 17.48,8.56 17.38,8.79C18.04,9.5 18.42,10.39 18.42,11.5C18.42,15.32 16.05,16.2 13.79,16.43C14.17,16.76 14.5,17.44 14.5,18.5V21C14.5,21.27 14.66,21.59 15.17,21.5C19.13,20.17 22,16.42 22,12A10,10 0 0,0 12,2Z"/>
          </svg>
          GitHub
        </a>
      </div>
    </footer>

    <script>
      (function () {
        var btn = document.querySelector('.hamburger');
        var menu = document.getElementById('mobileMenu');
        var labelOpen = {{ t.nav_open_menu|tojson }};
        var labelClose = {{ t.nav_close_menu|tojson }};
        if (!btn || !menu) return;

        function closeMenu() {
          btn.setAttribute('aria-expanded', 'false');
          btn.setAttribute('aria-label', labelOpen);
          menu.setAttribute('hidden', '');
          document.body.classList.remove('menu-open');
        }
        function openMenu() {
          btn.setAttribute('aria-expanded', 'true');
          btn.setAttribute('aria-label', labelClose);
          menu.removeAttribute('hidden');
          document.body.classList.add('menu-open');
        }

        btn.addEventListener('click', function () {
          var open = btn.getAttribute('aria-expanded') === 'true';
          open ? closeMenu() : openMenu();
        });

        menu.addEventListener('click', function (e) {
          if (e.target.tagName === 'A') closeMenu();
        });

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeMenu();
        });

        document.addEventListener('click', function (e) {
          if (menu.hasAttribute('hidden')) return;
          var within = e.target.closest('.mobile-menu, .hamburger');
          if (!within) closeMenu();
        });
      })();
    </script>
  </body>
</html>
