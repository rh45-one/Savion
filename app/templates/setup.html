{% extends "base.html" %}
{% block content %}
<h2>Setup</h2>

<div class="setup-grid">
  <!-- Fresh setup -->
  <section class="card setup-card">
    <h3 class="setup-title">Fresh setup</h3>
    <p class="setup-sub">{{ "Start a new ledger with an initial balance." }}</p>

    <form action="/setup" method="post" class="form-grid setup-form">
      <input type="hidden" name="setup_mode" value="fresh">

      <label>Initial balance
        <input type="number" name="initial_balance" step="0.01" min="0" required>
      </label>

      <div class="actions">
        <button type="submit">Start</button>
      </div>
    </form>
  </section>

  <!-- Import existing ledger -->
  <section class="card setup-card">
    <h3 class="setup-title">Import existing ledger</h3>
    <p class="setup-sub">Restore from a previously exported <code>.jsonl</code> file.</p>

    <form action="/setup" method="post" enctype="multipart/form-data" class="form-grid setup-form">
      <input type="hidden" name="setup_mode" value="import">

      <label>Ledger file
        <input type="file" name="ledger_file" accept=".jsonl,text/plain" required>
      </label>

      <div class="actions">
        <button type="submit">Import</button>
      </div>
    </form>
  </section>
</div>
{% endblock %}
