{% extends "base.html" %}
{% block content %}
<h2>Settings</h2>

<form action="/settings" method="post" class="card form-grid" style="max-width:720px">
  <label>Theme
    <select name="theme" required>
      <option value="dark"    {% if settings.theme == 'dark' %}selected{% endif %}>Dark</option>
      <option value="light"   {% if settings.theme == 'light' %}selected{% endif %}>Light</option>
      <option value="dracula" {% if settings.theme == 'dracula' %}selected{% endif %}>Dracula</option>
    </select>
  </label>

  <label>Fade start (balance where green begins to fade)
    <input type="number" name="fade_start" step="1" min="1" value="{{ settings.fade_start|default(1000) }}" required>
  </label>

  <label>Display currency
    <select name="currency" required>
      <option value="EUR" {% if settings.currency == 'EUR' %}selected{% endif %}>€ Euro</option>
      <option value="USD" {% if settings.currency == 'USD' %}selected{% endif %}>$ US Dollar</option>
      <option value="GBP" {% if settings.currency == 'GBP' %}selected{% endif %}>£ British Pound</option>
    </select>
  </label>

  <label>Timezone (IANA, e.g., <code>Europe/Madrid</code>)
    <input id="tzInput" type="text" name="timezone" value="{{ settings.timezone|default('Europe/Madrid') }}" required>
    <small id="tzPreview" style="color: var(--muted); display:block; margin-top:6px;">
      Current time in <strong>{{ settings.timezone }}</strong>: {{ tz_preview }}
    </small>
  </label>

  <button type="submit">Save</button>
</form>

<script>
  // Live timezone preview without listing cities; user types IANA zone
  (function () {
    var input = document.getElementById('tzInput');
    var preview = document.getElementById('tzPreview');
    if (!input || !preview) return;

    function render(zone) {
      if (!zone || !zone.trim()) {
        preview.innerHTML = 'Enter an IANA timezone, e.g. <code>Europe/Madrid</code>.';
        return;
      }
      try {
        var now = new Date();
        // European format via en-GB locale; show DD/MM/YYYY HH:MM
        var s = now.toLocaleString('en-GB', {
          timeZone: zone,
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', hour12: false
        }).replace(',', '');
        preview.innerHTML = 'Current time in <strong>' + zone + '</strong>: ' + s;
      } catch (e) {
        // RangeError for invalid timeZone
        preview.innerHTML = '⚠️ Invalid timezone. Try something like <code>Europe/Madrid</code> or <code>America/New_York</code>.';
      }
    }

    // Initial render (in case value changed server-side)
    render(input.value);

    // Update on user input
    input.addEventListener('input', function () { render(input.value); });
    input.addEventListener('change', function () { render(input.value); });
  })();
</script>
{% endblock %}
