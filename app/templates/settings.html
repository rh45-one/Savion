{% extends "base.html" %}
{% block content %}
<h2>{{ t.settings_title }}</h2>

<form action="/settings" method="post" class="card form-grid">
  <label>{{ t.settings_theme }}
    <select name="theme" required>
      <option value="dark"    {% if settings.theme == 'dark' %}selected{% endif %}>Dark</option>
      <option value="light"   {% if settings.theme == 'light' %}selected{% endif %}>Light</option>
      <option value="dracula" {% if settings.theme == 'dracula' %}selected{% endif %}>Dracula</option>
    </select>
  </label>

  <label>{{ t.settings_fade_start }}
    <input type="number" name="fade_start" step="1" min="1" value="{{ settings.fade_start|default(1000) }}" required>
  </label>

  <label>{{ t.settings_currency }}
    <select name="currency" required>
      <option value="EUR" {% if settings.currency == 'EUR' %}selected{% endif %}>{{ t.currency_eur }}</option>
      <option value="USD" {% if settings.currency == 'USD' %}selected{% endif %}>{{ t.currency_usd }}</option>
      <option value="GBP" {% if settings.currency == 'GBP' %}selected{% endif %}>{{ t.currency_gbp }}</option>
    </select>
  </label>

  <label>{{ t.settings_timezone }}
    <input id="tzInput" type="text" name="timezone" value="{{ settings.timezone|default('Europe/Madrid') }}" required>
    <small id="tzPreview" style="color: var(--muted); display:block; margin-top:6px;">
      {{ t.tz_preview_prefix }} <strong>{{ settings.timezone }}</strong>: {{ tz_preview }}
    </small>
  </label>

  <label>{{ t.settings_language }}
    <select name="language" required>
      <option value="en" {% if settings.language == 'en' %}selected{% endif %}>{{ t.language_en }}</option>
      <option value="es" {% if settings.language == 'es' %}selected{% endif %}>{{ t.language_es }}</option>
      <option value="fr" {% if settings.language == 'fr' %}selected{% endif %}>{{ t.language_fr }}</option>
    </select>
  </label>

  <button type="submit">{{ t.settings_save }}</button>
</form>

<script>
  // Live timezone preview
  (function () {
    var input = document.getElementById('tzInput');
    var preview = document.getElementById('tzPreview');
    if (!input || !preview) return;

    function render(zone) {
      if (!zone || !zone.trim()) {
        preview.innerHTML = '{{ t.settings_timezone|escape }}';
        return;
      }
      try {
        var now = new Date();
        var s = now.toLocaleString('en-GB', {
          timeZone: zone,
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', hour12: false
        }).replace(',', '');
        preview.innerHTML = '{{ t.tz_preview_prefix }} ' + '<strong>' + zone + '</strong>: ' + s;
      } catch (e) {
        preview.innerHTML = '⚠️ Invalid timezone.';
      }
    }

    render(input.value);
    input.addEventListener('input', function () { render(input.value); });
    input.addEventListener('change', function () { render(input.value); });
  })();
</script>
{% endblock %}
