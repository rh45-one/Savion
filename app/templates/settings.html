{% extends "base.html" %}
{% block content %}
<h2>{{ t.settings_title }}</h2>

<form action="/settings" method="post" class="card form-grid">
  <label>{{ t.settings_theme }}
    <select name="theme" required>
      <option value="dark"       {% if settings.theme == 'dark' %}selected{% endif %}>Dark</option>
      <option value="light"      {% if settings.theme == 'light' %}selected{% endif %}>Light</option>
      <option value="dracula"    {% if settings.theme == 'dracula' %}selected{% endif %}>Dracula</option>
      <option value="winclassic" {% if settings.theme == 'winclassic' %}selected{% endif %}>Windows Classic</option>
      <option value="system1"    {% if settings.theme == 'system1' %}selected{% endif %}>Apple System 1</option>
    </select>
  </label>

  <label>{{ t.settings_fade_start }}
    <input type="number" name="fade_start" step="1" min="1" value="{{ settings.fade_start|default(1000) }}" required>
  </label>

  <label>{{ t.settings_currency }}
    <select name="currency" required>
      <option value="EUR" {% if settings.currency == 'EUR' %}selected{% endif %}>{{ t.currency_eur }}</option>
      <option value="USD" {% if settings.currency == 'USD' %}selected{% endif %}>{{ t.currency_usd }}</option>
      <option value="GBP" {% if settings.currency == 'GBP' %}selected{% endif %}>{{ t.currency_gbp }}</option>
    </select>
  </label>

  <label>{{ t.settings_timezone }}
    <input id="tzInput" type="text" name="timezone" value="{{ settings.timezone|default('Europe/Madrid') }}" required>
    <small id="tzPreview" style="color: var(--muted); display:block; margin-top:6px;">
      {{ t.tz_preview_prefix }} <strong>{{ settings.timezone }}</strong>: {{ tz_preview }}
    </small>
  </label>

  <label>{{ t.settings_language }}
    <select name="language" required>
      <option value="en" {% if settings.language == 'en' %}selected{% endif %}>{{ t.language_en }}</option>
      <option value="es" {% if settings.language == 'es' %}selected{% endif %}>{{ t.language_es }}</option>
      <option value="fr" {% if settings.language == 'fr' %}selected{% endif %}>{{ t.language_fr }}</option>
      <option value="zh" {% if settings.language == 'zh' %}selected{% endif %}>{{ t.language_zh }}</option>
      <option value="pt" {% if settings.language == 'pt' %}selected{% endif %}>{{ t.language_pt }}</option>
      <option value="ja" {% if settings.language == 'ja' %}selected{% endif %}>{{ t.language_ja }}</option>
      <option value="de" {% if settings.language == 'de' %}selected{% endif %}>{{ t.language_de }}</option>
      <option value="it" {% if settings.language == 'it' %}selected{% endif %}>{{ t.language_it }}</option>
    </select>
  </label>

  <!-- Tag types editor -->
  <fieldset class="tag-editor" style="grid-column: 1 / -1;">
    <legend>{{ t.settings_tags_group }}</legend>
    <p class="muted" style="margin-top:0">{{ t.settings_tags_help }}</p>

    <div id="tagRows" class="tag-rows">
      {% for tg in settings.tag_types %}
      <div class="tag-row">
        <label class="tag-col">
          <span class="tag-label">{{ t.settings_tag_name }}</span>
          <input type="text" name="tag_name" value="{{ tg.name }}" placeholder="{{ t.placeholder_example_tag }}" required>
        </label>
        <label class="tag-col tag-color-col">
          <span class="tag-label">{{ t.settings_tag_color }}</span>
          <input type="color" name="tag_color" value="{{ tg.color|default('#777777') }}">
        </label>
        <!-- Make remove button clearly destructive and perfectly aligned -->
        <button type="button" class="tag-remove danger" aria-label="{{ t.settings_remove }}">{{ t.settings_remove }}</button>
      </div>
      {% endfor %}
    </div>

    <div class="tag-toolbar">
      <button type="button" id="addTagBtn">{{ t.settings_add_tag }}</button>
    </div>
  </fieldset>

  <button type="submit">{{ t.settings_save }}</button>
</form>

<script>
  // Live timezone preview
  (function () {
    var input = document.getElementById('tzInput');
    var preview = document.getElementById('tzPreview');
    if (!input || !preview) return;
    function render(zone) {
      if (!zone || !zone.trim()) { preview.innerHTML = '{{ t.settings_timezone|escape }}'; return; }
      try {
        var s = new Date().toLocaleString('en-GB', {
          timeZone: zone, year:'numeric', month:'2-digit', day:'2-digit',
          hour:'2-digit', minute:'2-digit', hour12:false
        }).replace(',', '');
        preview.innerHTML = '{{ t.tz_preview_prefix }} ' + '<strong>' + zone + '</strong>: ' + s;
      } catch (e) {
        preview.innerHTML = {{ t.error_invalid_timezone|tojson }};
      }
    }
    render(input.value);
    input.addEventListener('input', function(){ render(input.value); });
    input.addEventListener('change', function(){ render(input.value); });
  })();

  // Tag editor
  (function () {
    var rows = document.getElementById('tagRows');
    var addBtn = document.getElementById('addTagBtn');
    if (!rows || !addBtn) return;

    function onRemove(e) {
      var row = e.target.closest('.tag-row');
      if (row) row.remove();
    }

    function addRow(name, color) {
      var div = document.createElement('div');
      div.className = 'tag-row';
      div.innerHTML = `
        <label class="tag-col">
          <span class="tag-label">{{ t.settings_tag_name }}</span>
          <input type="text" name="tag_name" value="${name || ''}" placeholder="{{ t.placeholder_example_tag }}" required>
        </label>
        <label class="tag-col tag-color-col">
          <span class="tag-label">{{ t.settings_tag_color }}</span>
          <input type="color" name="tag_color" value="${color || '#777777'}">
        </label>
        <button type="button" class="tag-remove danger">{{ t.settings_remove }}</button>
      `;
      div.querySelector('.tag-remove').addEventListener('click', onRemove);
      rows.appendChild(div);
    }

    // Bind existing remove buttons
    rows.querySelectorAll('.tag-remove').forEach(function (btn) {
      btn.addEventListener('click', onRemove);
    });

    addBtn.addEventListener('click', function () { addRow('', '#777777'); });
  })();
</script>
{% endblock %}
